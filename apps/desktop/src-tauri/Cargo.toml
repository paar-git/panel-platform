[package]
name = "project-host-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# Tauri builds the application as a library so the same code can be driven by
# the desktop binary and, later, by tests.
name = "project_host_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
project-host-core = { version = "0.1.0", path = "../../../crates/app-core" }
project-host-database = { version = "0.1.0", path = "../../../crates/database" }
project-host-power = { version = "0.1.0", path = "../../../crates/power" }
project-host-api-types = { version = "0.1.0", path = "../../../crates/api-types" }
project-host-file-manager = { version = "0.1.0", path = "../../../crates/file-manager" }
project-host-platform = { version = "0.1.0", path = "../../../crates/platform" }
project-host-toolchain = { version = "0.1.0", path = "../../../crates/toolchain" }
project-host-project-manager = { version = "0.1.0", path = "../../../crates/project-manager" }
# Only for `Secret`: a token from the creation form is wrapped the moment it is
# read, so nothing downstream can print it by accident.
project-host-security = { version = "0.1.0", path = "../../../crates/security" }
project-host-discord-gateway = { version = "0.1.0", path = "../../../crates/discord-gateway" }
project-host-updater = { version = "0.1.0", path = "../../../crates/updater" }
# Serving a static project, in the second mode this executable runs in. See
# `static_server_request` in `lib.rs`.
project-host-static-server = { version = "0.1.0", path = "../../../crates/static-server" }
# Only used to fetch the release manifest. rustls rather than the platform TLS
# stack so the same code path runs on Windows and Linux.
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
    "charset",
    "http2",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Host CPU, memory and disk. The dashboard reports what this machine is
# actually doing; without this it would have to either invent the numbers or
# leave the panel empty.
sysinfo = { version = "0.33", default-features = false, features = [
    "system",
    "disk",
] }
tauri = { version = "2", features = [] }
# The install half of the update flow. `crates/updater` decides *whether* to
# offer a release; this replaces the running application, which is the one step
# only the shell can perform — on Windows a running `.exe` cannot overwrite
# itself, so the installer has to take over.
tauri-plugin-updater = "2"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync"] }
tracing = "0.1.44"

[features]
# Serve the frontend from inside the binary rather than from `devUrl`.
#
# `tauri build` sets this; a plain `cargo build` does not, and the resulting
# executable points its window at the Vite dev server — which, with no dev server
# running, shows the WebView's own "can't reach this page" instead of the
# application. Anyone running the debug binary directly wants:
#
#     cargo run -p project-host-desktop --features custom-protocol
#
# It requires `pnpm --filter project-host-desktop build` to have produced
# `apps/desktop/dist` first, because that is what gets embedded.
custom-protocol = ["tauri/custom-protocol"]

[lints]
workspace = true
