<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel Platform</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #0e0e10;
        color: #e8e8ec;
        color-scheme: dark;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      #root {
        height: 100%;
      }
      .boot {
        display: grid;
        place-items: center;
        height: 100%;
      }
      .boot-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        padding: 40px 48px;
      }
      .boot-mark {
        display: grid;
        place-items: center;
        width: 72px;
        height: 72px;
        border-radius: 16px;
        background-image: linear-gradient(160deg, #23232c 0%, #191920 100%);
        box-shadow:
          0 1px 2px rgb(0 0 0 / 0.4),
          inset 0 1px 0 rgb(255 255 255 / 0.07);
        border: 1px solid rgb(255 255 255 / 0.06);
      }
      .boot-name {
        margin: 8px 0 0;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      .boot-caption {
        margin: 0;
        font-size: 12px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #9d9da8;
      }
      .boot-bar {
        width: 160px;
        height: 2px;
        overflow: hidden;
        border-radius: 999px;
        background: rgb(255 255 255 / 0.08);
      }
      .boot-bar span {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #2563eb, #00a2ff);
        animation: boot-bar 1.1s ease-in-out infinite;
      }
      @keyframes boot-bar {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(350%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-bar span {
          width: 100%;
          animation: none;
          opacity: 0.7;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-live="polite">
        <div class="boot-card">
          <div class="boot-mark">
            <svg width="56" height="56" viewBox="0 0 32 32" fill="none" aria-hidden="true">
              <defs>
                <linearGradient id="pp-boot" x1="0" y1="1" x2="1" y2="0">
                  <stop offset="0%" stop-color="#2563eb" />
                  <stop offset="100%" stop-color="#00a2ff" />
                </linearGradient>
              </defs>
              <g transform="translate(0 6.6) skewY(-20)" fill="url(#pp-boot)">
                <rect x="2.4" y="2.6" width="17.2" height="6.2" rx="1.3" />
                <rect x="2.4" y="9.6" width="4" height="6.2" rx="1.1" />
                <rect x="7.3" y="9.6" width="16.6" height="6.2" rx="1.3" />
                <rect x="2.4" y="16.6" width="4" height="6.2" rx="1.1" />
                <rect x="7.3" y="16.6" width="14" height="6.2" rx="1.3" />
              </g>
              <rect x="22.9" y="0.9" width="6.4" height="6.4" rx="2" fill="#2f6fe4" />
              <rect x="24.5" y="2.5" width="3.2" height="3.2" rx="0.9" fill="#38bdf8" />
            </svg>
          </div>
          <p class="boot-name">Panel Platform</p>
          <p class="boot-caption">Starting</p>
          <div class="boot-bar" aria-hidden="true"><span></span></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
