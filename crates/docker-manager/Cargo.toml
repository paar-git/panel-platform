[package]
name = "project-host-docker-manager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait = "0.1.91"
bollard = "0.21.0"
bytes = "1.10"
futures-util = "0.3.33"
# Packs the build context. Uncompressed: the daemon is local, so compressing
# would cost CPU to save nothing.
tar = "0.4.44"
project-host-platform = { version = "0.1.0", path = "../platform" }
serde = "1.0.229"
serde_json = "1.0.151"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["time"] }
tracing = "0.1.44"

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }

[features]
# Test doubles. No production dependency enables this.
testing = []

