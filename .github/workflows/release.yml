name: Release

# Pushing a `v*` tag builds installers for every supported platform and attaches
# them to a draft release, together with the `latest.json` the in-app updater
# reads. The release is a draft on purpose: nothing reaches users until someone
# has looked at the artefacts and pressed publish.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (must already exist)'
        required: true

permissions:
  contents: write

jobs:
  # Cheap gate. A tag that disagrees with the version in the tree produces a
  # release whose installers announce a different version than their filename,
  # and the updater compares versions — so this fails the run in seconds rather
  # than shipping the confusion.
  check-version:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match tauri.conf.json, Cargo.toml and package.json
        run: bash scripts/check-version.sh "${{ github.event.inputs.tag || github.ref_name }}"
      # `tauri-action` parses these manifests with a TOML reader that rejects a
      # BOM. Failing here costs seconds; failing in the build costs the whole
      # matrix.
      - name: No file starts with a BOM
        run: bash scripts/check-no-bom.sh
      # The notes become `latest.json`'s `notes`, and every client already
      # installed refuses a manifest that exceeds the limit compiled into it.
      # Failing the release is recoverable; shipping a manifest the fleet
      # rejects is not.
      - name: Release notes fit what installed clients accept
        run: bash scripts/check-release-notes.sh

  build:
    needs: check-version
    strategy:
      # One platform failing should not cancel the others: a broken Linux build
      # is worth knowing about at the same time as a working Windows one.
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          # 22.04 rather than 24.04: the glibc a binary is built against is the
          # oldest it can run on, and webkit2gtk-4.1 is packaged here.
          - platform: ubuntu-22.04
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            build-essential \
            curl \
            wget \
            file

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './ -> target'

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Authenticode. Without a signature Windows shows every downloader
      # "Windows protected your PC" and offers only "Don't run" until they
      # find "More info" — so the executables are signed through Azure
      # Trusted Signing, which is Microsoft's own service and needs no
      # hardware token in CI.
      #
      # It is opt-in on purpose: a fork, or this repository before the Azure
      # account exists, has none of these configured and must still be able to
      # cut a release. When `AZURE_CODESIGN_ACCOUNT` is unset the step writes
      # no config, `tauri-action` gets no extra argument, and the build is
      # exactly what it was before — unsigned, and honest about it.
      - name: Set up Azure Trusted Signing
        id: codesign
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          ENDPOINT: ${{ vars.AZURE_CODESIGN_ENDPOINT }}
          ACCOUNT: ${{ vars.AZURE_CODESIGN_ACCOUNT }}
          PROFILE: ${{ vars.AZURE_CODESIGN_PROFILE }}
        run: |
          set -euo pipefail

          if [ -z "${ACCOUNT:-}" ] || [ -z "${PROFILE:-}" ] || [ -z "${ENDPOINT:-}" ]; then
            echo "::warning::AZURE_CODESIGN_ENDPOINT/ACCOUNT/PROFILE are not set,"
            echo "::warning::so the Windows installers will be unsigned and"
            echo "::warning::SmartScreen will warn about them."
            echo "args=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          cargo install trusted-signing-cli --locked

          # A separate config file rather than an edit to tauri.conf.json:
          # `tauri build` merges the two, so a local build stays unsigned and
          # nobody has to own an Azure account to compile the application.
          # The path is absolute because the CLI's working directory here is
          # not the directory this file lives in.
          config="${GITHUB_WORKSPACE}/apps/desktop/src-tauri/tauri.signing.conf.json"
          cat > "$config" <<EOF
          {
            "\$schema": "https://schema.tauri.app/config/2",
            "bundle": {
              "windows": {
                "signCommand": "trusted-signing-cli -e ${ENDPOINT} -a ${ACCOUNT} -c ${PROFILE} -d \"Panel Platform\" %1"
              }
            }
          }
          EOF
          cat "$config"
          echo "args=--config $config" >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artefacts. Without these the build still produces
          # installers, but `latest.json` would carry no usable signature and
          # every client would reject the update.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Read by `trusted-signing-cli` when the step above configured one.
          # Unset everywhere else, which is why that step is what decides
          # whether signing is attempted at all.
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: 'Panel Platform __VERSION__'
          # GitHub always appends "Source code (zip/tar.gz)" to a release and
          # that cannot be turned off. So the installers are named first and
          # explicitly, and the source archives are named as what they are —
          # otherwise the two most prominent links on the page are the two
          # nobody wanting to *use* the application should click.
          releaseBody: |
            ## What changed in 0.1.17

            A repair release. Both faults below were reported from a real
            machine, and both were one rule applied more widely than the thing
            it was written to prevent.

            **A project with links in it can be imported again.** Dropping a
            folder that contained a symbolic link stopped the whole import with
            "symbolic links cannot be imported" — and on Windows a junction
            counts as one, which is what `npm` and `pnpm` build `node_modules`
            out of. So importing any real Node project failed, whatever else
            was in it. Links are now skipped rather than fatal: they are not
            copied, because a copy is not the place they point at, and they are
            still never followed, but they no longer veto the thousands of
            files beside them. What was skipped is counted rather than dropped
            in silence.

            **Installing a toolchain no longer fails on a machine that has
            it.** `npm` is `npm.cmd` on Windows, and the search Windows does
            for a bare program name only ever tries `.exe` — so the step never
            started, and reported "npm exited with code -1. program not found",
            a sentence that contradicts itself about a program that had not
            run. The program is now resolved before it is started, the way the
            rest of the application already did it.

            **A failure names the thing that failed.** Every step of an install
            was reported under the language's name, so a project's own
            `npm install` failing read as "Installing Node.js failed" — sending
            you to reinstall something that had installed perfectly. And a
            program that could not be started is no longer described as having
            exited with a made-up code.

            ## What changed in 0.1.16

            **A project can be more than one process.** An API next to a web server, or
            anything with a background worker, is now one project rather than three
            pretending not to know each other. Each process carries its own command, its
            own install and build steps, its own environment and its own port, and the
            set is edited in the application — Panel does not write a file into your
            repository to remember it.

            **They start one at a time, in the order you put them in.** The second
            process spawns once the first has settled, or once it reports healthy when
            you have given it a health check. Nothing races for a port or for a database
            that is not up yet. If one cannot start, the ones already up are stopped in
            reverse order and the failure names the process that caused it, rather than
            leaving half a project running.

            **A single process can be restarted on its own.** Restarting the web server
            while the API keeps its connections is now a button rather than a reason to
            restart everything.

            **Docker is gone rather than deprecated.** The daemon, the generated
            Dockerfiles, the container ports and the mode switch are all removed. Your
            projects already ran as local processes in 0.1.15; what goes now is the
            vocabulary that outlived the containers — including a `/app` working
            directory that no computer here has ever had.

            **The application has been redesigned.** It is arranged by place rather than
            by tool: a project's files, processes, console and settings are somewhere you
            go, not tabs you hunt for. New palette and card language throughout.

            A correctness review before this release found ten faults that nothing was
            failing on — among them health checks that could never fail a start, a
            "restart" that only stopped, and process rows that never returned to stopped.
            All ten are fixed, with tests that start real processes and check the
            operating system agrees.

            ## What changed in 0.1.15

            **Your projects run on your machine, not in a container.** Host mode is now
            how a project runs: the application starts the process itself, watches it,
            restarts it when it dies and stops it when you quit. Docker is no longer
            something you install before you can run your own code on your own computer.
            Existing projects are moved to it by the upgrade; the container path still
            compiles, but nothing in the interface produces it any more.

            **A static site serves itself.** Every other runtime brings its own way of
            running — a Node project runs `node`, a Python project runs `python` — but a
            static site is a directory of files, and under Docker the container's web
            server was what served them. Without a container a static project could not
            start at all. The application now carries a small read-only HTTP server and
            uses it, so a static site needs neither a container nor a language it does not
            use. It serves the built output when the project has a publish directory, and
            refuses one that would climb out of the project rather than putting your disk
            on a port.

            **Discord bots actually connect.** A bot is added by its token, which is
            checked against Discord before it is stored and then kept encrypted with a key
            that survives restarts — so a bot is entered once, not daily. Each connection
            is supervised the way a project is: it reconnects on its own, and what it is
            doing is visible rather than guessed at.

            **"Running" now means running.** A project that started cleanly and then died
            of its own bug used to read `Running` until somebody pressed a button, and when
            it did change it said `Failed` — the same word used for a project that never
            started at all. Those are different situations with different answers, so a
            project that dies after starting is now `Crashed`, and stored status is
            reconciled against what is actually happening rather than only written when a
            button is pressed.

            **The machine is somebody's computer, and the application treats it as one.**
            It samples what the machine is doing and adjusts: a project can be given a
            lower or higher scheduling priority, and a project you mark as needing to stay
            available holds off sleep while it runs. Both are off by default, because a
            priority nobody chose is not a preference and a machine that stops sleeping
            should do so because you asked. Nothing here can stop a project — where saving
            power and keeping a project available conflict, the project wins.

            **A port conflict says who has the port.** Running projects as local processes
            means they bind real ports, so a conflict is ordinary rather than exotic. The
            application names the process already listening instead of reporting that the
            start failed.

            **Every project has its own console.** Output is per project, sequenced and
            kept, so five projects running at once produce five consoles that cannot
            interleave.

            **The interface has been rebuilt around the project you are working on.** An
            activity rail and a project switcher replace the old sidebar and title bar,
            workspace tabs keep what you had open, and run controls and status sit where
            you are already looking rather than on a separate overview page.

            ## What changed in 0.1.14

            A maintenance release. Everything here is a fix to how a project
            that *cannot stay up* is supervised and reported — the path where
            getting it wrong is least visible and most confusing.

            **A project that crashed and restarted now explains itself with the
            output of the run that just failed.** Each restart began collecting
            the replacement's output into a new place and kept reading the old
            one, so every failure after the first was reported with words you
            had already seen, and "gave up after 5 restarts" showed you the run
            from five crashes ago. Attempts now share one excerpt, so what you
            read is the sequence the crash loop actually produced.

            **A project that fails to start no longer keeps restarting
            invisibly.** If a host project died in the first moments of its
            start, the application told you the start had failed — and then went
            on restarting it up to five more times, against a port you had just
            been told was free, with nothing in the interface able to stop it
            because nothing knew it existed. A failed start now stops for good.

            **A failure report waits for the last line rather than the first.**
            The output of a dying process arrives a moment after the process
            does, and the report used to be assembled as soon as anything had
            arrived. It now waits for the output to finish — bounded, so a
            project that leaves something else holding its output can delay the
            report but never hang it.

            **The release itself is checked more honestly.** 0.1.13 was built
            and published with a `Cargo.lock` still naming 0.1.12 for all
            sixteen of its own crates; nothing looked, and the build quietly
            rewrote it. The version gate now reads the lock file too, so a
            release cannot be cut from a tree whose pinned versions disagree
            with the version on the box.

            This release also carries everything in 0.1.13, below.

            ## What changed in 0.1.13

            **Projects can now run directly on the host, not only through
            Docker.** The runner has a process-backed lifecycle beside the
            container path: it starts the configured command, captures output,
            polls health, restarts crashed projects and stops the whole process
            tree when the application quits.

            **The app measures the machine before starting more work.** It
            records CPU, memory, disk, virtualization, WSL and GPU capabilities,
            refuses starts the host cannot safely hold, and derives default
            resource limits from what it found instead of from a fixed guess.

            **Linux process shutdown is safer and more reliable.** The Unix
            runner now signals the process tree by naming it directly, avoids
            counting zombies as running work, and removes diagnostic paths that
            could hang instead of answering.

            **The theme catalogue is generated from one engine.** The release
            records the themes that were actually built and keeps the theme CSS
            formatted by the same checks that gate the rest of the app.

            This release also carries everything in 0.1.12, below.

            ## What changed in 0.1.12

            **The interface has been designed rather than assembled.** The
            sidebar head is rebuilt around the real Panel Platform mark, with
            the workspace name, an overflow menu and a primary action on its
            own band. The blue is not the old accent: white on that accent
            measured 3.68:1 and failed WCAG AA at 13px, so the gradient used
            here was chosen against the measurement.

            **Themes, accents, density, text size and motion.** Five themes and
            six accents driven by a `data-theme` attribute over the token set,
            so switching one re-paints without re-rendering and no component
            knows which theme is on. Motion runs off a single scale variable —
            reduced is 40%, off collapses to near-zero — and the operating
            system's reduced-motion preference can veto full motion but can
            never force motion on.

            **Every project has a designed mark instead of a letter in a box.**
            The glyph says what the project is, so the shape becomes learnable
            across every Node project; the colour says which project it is,
            derived from the id so the same project is the same colour in the
            list, the header and the switcher — on every machine, after every
            reinstall, with nothing stored and nothing to migrate.

            **47 icons redrawn as one set**, against one live area and one
            stroke weight, with fill reserved for the two transport controls
            whose state has to read instantly.

            **The two settings that remembered their position and did nothing
            now do something.** Project state changes are announced only on
            transition, never on first load, so opening the window does not
            toast once per running project. Developer mode shows the
            identifiers a bug report needs, selectable.

            **The update manager is one window.** The update used to be drawn
            in three places — a banner, a panel in Settings and a button in the
            editor title bar — each with its own idea of the same install. It
            is now a single window with a stage rail (Download, Verify,
            Install, Finish), and percentage, size, transfer rate and time
            remaining beside it. Every figure is derived from bytes the core
            actually reported, and each shows nothing rather than a guess when
            the data cannot support one. Restart and Minimise are real commands
            now, so a long download can be put aside and the new version can
            start itself.

            **There is still no pause and no cancel, and that is not an
            oversight.** The updater downloads, verifies and installs in one
            uninterruptible call. Offering either button would mean replacing
            it with a downloader of our own that re-implements signature
            verification against the compiled-in key — a weaker security path
            bought for a button. Close is disabled, rather than hidden, while
            closing would cost the download or leave a half-written
            application.

            The new update window has not been exercised against a real
            download from a published release; that needs this release to
            exist first.

            This release also carries everything in 0.1.11, below.

            ## What changed in 0.1.11

            **The application looks at the machine it was installed on.** A
            compatibility scan probes CPU, memory, storage volumes, operating
            system identity, virtualization, WSL and GPU, tiers the machine
            from what it found, and derives resource defaults for new projects
            from that tier rather than from a fixed guess. Where no Docker
            artefact applies to a machine, it says which one and why instead of
            offering a download that cannot work.

            **A missing language runtime is now offered rather than reported.**
            Starting a project checks the toolchain it needs — on every start
            path, not one — and offers to install what is missing.

            This release also carries everything in 0.1.10, below.

            Earlier releases are listed at https://github.com/paar-git/panel-platform/releases.

            ## Download

            **Pick one of the installers below — you do not need to download
            the source code, clone anything, or install any development
            tools.** The "Source code" archives at the bottom of this list are
            added by GitHub automatically and are only useful if you intend to
            build the application yourself.

            **If you would rather not choose**, download the setup program for
            your system. It works out which of the files below you need, checks
            it against Panel Platform's signature, and starts the installer.

            | Your system | Setup program |
            | --- | --- |
            | Windows 10 / 11 (64-bit) | `PanelPlatformSetup.exe` |
            | 64-bit Linux | `panel-platform-setup-x86_64` |

            Or pick a file yourself:

            | Your system | Download this | |
            | --- | --- | --- |
            | **Windows 10 / 11** (64-bit) | `Panel.Platform_*_x64-setup.exe` | **Recommended** |
            | Windows, for deployment tooling | `Panel.Platform_*_x64_en-US.msi` | Group Policy, Intune |
            | **Debian / Ubuntu** | `Panel.Platform_*_amd64.deb` | **Recommended** |
            | Any other 64-bit Linux | `Panel.Platform_*_amd64.AppImage` | Portable, self-updating |

            ## Installing

            **Windows** — run the `-setup.exe` and follow the prompts. It
            installs the WebView2 runtime if your machine does not already have
            it. The application appears in the Start Menu as *Panel Platform*.

            **Debian / Ubuntu**

            ```bash
            sudo apt install ./Panel.Platform_*_amd64.deb
            ```

            **Other Linux**

            ```bash
            chmod +x Panel.Platform_*_amd64.AppImage
            ./Panel.Platform_*_amd64.AppImage
            ```

            ## What you need

            Nothing is required to *install* or *open* the application — no
            Node.js, no Rust, no pnpm, no toolchain of any kind. Everything it
            needs is inside the installer.

            **Docker is required to actually run projects**, because a project
            runs in a container. The application installs and opens without
            Docker and tells you it is missing, rather than failing at launch.
            Install [Docker Desktop](https://www.docker.com/products/docker-desktop/)
            on Windows, or Docker Engine on Linux.

            ## These builds are not code-signed

            There is no signing certificate yet, and saying so plainly beats
            letting you discover it:

            - **Windows** shows a **"Windows protected your PC"** warning on
              first run, offering only **Don't run** until you choose **More
              info**, and then **Run anyway**. Nothing is wrong with the file;
              Windows has simply never seen it signed.
            - **Linux** packages carry no repository signature.

            The release can sign its Windows builds as soon as a certificate
            exists — the machinery is in place and waiting on the account — and
            these notes will say so when it does rather than before.

            `SHA256SUMS.txt` is attached. To check what you downloaded:

            ```powershell
            # Windows
            Get-FileHash .\<file> -Algorithm SHA256
            ```

            ```bash
            # Linux
            sha256sum -c SHA256SUMS.txt --ignore-missing
            ```

            ## Updates

            The application checks for new releases and offers them; nothing
            installs until you press the button. Downloads are verified against
            a signing key built into the application, not one supplied by the
            release feed. The `.deb` cannot update itself — dpkg owns those
            files — so upgrade it by installing the next `.deb`.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }} ${{ steps.codesign.outputs.args }}

  # The setup program: a small binary that downloads the right installer from
  # this release, verifies it, and starts it. Built after `build` rather than
  # beside it only because the draft release it uploads into does not exist
  # until `tauri-action` creates it.
  bootstrap:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            binary: panel-platform-setup.exe
            asset: PanelPlatformSetup.exe
          - platform: ubuntu-22.04
            binary: panel-platform-setup
            asset: panel-platform-setup-x86_64

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # eframe on the glow backend. Deliberately *not* webkit2gtk: this program
      # runs before the application is installed, so it may not depend on
      # anything the .deb exists to provide.
      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libx11-dev \
            libxkbcommon-dev \
            libwayland-dev \
            build-essential

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './ -> target'

      - name: Build
        run: cargo build --release -p panel-platform-setup

      # This is the file the download table recommends first, so it is the one
      # most people meet SmartScreen through. Signed with the same profile as
      # the installers it downloads. Signing happens before the upload, and
      # therefore before `checksums` hashes it — an unsigned hash for a signed
      # file would fail every verification the release notes ask for.
      - name: Sign it
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          ENDPOINT: ${{ vars.AZURE_CODESIGN_ENDPOINT }}
          ACCOUNT: ${{ vars.AZURE_CODESIGN_ACCOUNT }}
          PROFILE: ${{ vars.AZURE_CODESIGN_PROFILE }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${ACCOUNT:-}" ] || [ -z "${PROFILE:-}" ] || [ -z "${ENDPOINT:-}" ]; then
            echo "::warning::Azure Trusted Signing is not configured, so"
            echo "::warning::${{ matrix.asset }} will be unsigned."
            exit 0
          fi

          cargo install trusted-signing-cli --locked
          trusted-signing-cli \
            -e "$ENDPOINT" -a "$ACCOUNT" -c "$PROFILE" \
            -d "Panel Platform Setup" \
            "target/release/${{ matrix.binary }}"

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cp "target/release/${{ matrix.binary }}" "${{ matrix.asset }}"
          gh release upload "$TAG" "${{ matrix.asset }}" \
            --repo "$GITHUB_REPOSITORY" --clobber

      # The real path, against the real artefacts, over the real network:
      # resolve the latest release, download it, check its signature and its
      # checksum, and stop before installing anything.
      #
      # It reads the *latest published* release, which is not the draft this
      # run just built. Until a release is published there is nothing to read,
      # and the step says so rather than reporting a green it did not earn.
      - name: Verify it can resolve, download and check a real release
        shell: bash
        run: |
          set -uo pipefail
          output=$(./"${{ matrix.asset }}" --dry-run 2>&1) && code=0 || code=$?
          echo "$output"

          if [ $code -eq 0 ]; then
            echo "Verified a published release end to end."
            exit 0
          fi

          if echo "$output" | grep -q "no published release yet"; then
            echo "::warning::No release is published yet, so only the error"
            echo "::warning::path was exercised. This step will verify a real"
            echo "::warning::download once a release has been published."
            exit 0
          fi

          echo "::error::The setup program failed against the published release."
          exit 1

  # Checksums are only meaningful once every platform's assets exist, so this
  # runs after the matrix rather than inside it. It must also wait for
  # `bootstrap`, or SHA256SUMS.txt would silently omit the two artefacts most
  # in need of a checksum.
  checksums:
    needs: [build, bootstrap]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Compute SHA-256 for every attached asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p assets && cd assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*' || true
          if [ -z "$(ls -A)" ]; then
            echo "No assets found on $TAG" >&2
            exit 1
          fi
          sha256sum * | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber

  # Smoke tests. These install the artefacts the release actually carries —
  # downloaded from the draft release, never rebuilt — and prove two things
  # only: that the package installs, and that the application starts and stays
  # up. They say nothing about whether any feature works.
  smoke-linux:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Install a desktop runtime for the application to start against
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libwebkit2gtk-4.1-0 libgtk-3-0 \
            libayatana-appindicator3-1 dbus-x11

      - name: Download the release artefacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p artefacts && cd artefacts
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern '*.deb' --pattern '*.AppImage'
          ls -lh

      - name: Install the .deb
        run: |
          set -euo pipefail
          cd artefacts
          deb="$(ls *.deb | head -n 1)"
          echo "Installing $deb"
          # `dpkg -i` fails rather than resolving dependencies; `apt-get -f`
          # is the documented repair step and is what a user hitting this
          # would run.
          sudo dpkg -i "$deb" || sudo apt-get install -f -y
          # Read the package name from the archive rather than assuming it:
          # it derives from productName and would change with it.
          pkg="$(dpkg-deb -f "$deb" Package)"
          echo "PKG=$pkg" >> "$GITHUB_ENV"

      - name: Verify the package is installed
        run: |
          set -euo pipefail
          dpkg -s "$PKG"
          dpkg -s "$PKG" | grep -q '^Status: install ok installed'
          echo "Files installed:"
          dpkg -L "$PKG"
          bin="$(dpkg -L "$PKG" | grep -E '^/usr/bin/' | head -n 1)"
          test -x "$bin"
          echo "BIN=$bin" >> "$GITHUB_ENV"

      - name: Launch the installed application under xvfb
        run: |
          set -uo pipefail
          mkdir -p logs
          echo "Launching $BIN"
          xvfb-run -a --server-args="-screen 0 1280x900x24" \
            "$BIN" > logs/deb-launch.log 2>&1 &
          pid=$!
          # Ten seconds is enough to distinguish "started" from "died on
          # startup", which is the only distinction this test is entitled to
          # make.
          for i in $(seq 1 10); do
            sleep 1
            if ! kill -0 "$pid" 2>/dev/null; then
              wait "$pid"; code=$?
              echo "::error::The .deb application exited after ${i}s with code $code"
              echo "--- output ---"; cat logs/deb-launch.log
              exit 1
            fi
          done
          echo "Still running after 10s."
          kill "$pid" 2>/dev/null || true
          cat logs/deb-launch.log

      - name: Launch the AppImage under xvfb
        run: |
          set -uo pipefail
          mkdir -p logs
          cd artefacts
          app="$(ls *.AppImage | head -n 1)"
          chmod +x "$app"
          echo "Launching $app"
          # No FUSE on the runner, so the AppImage is extracted and its inner
          # entry point run — the same binary, without needing a kernel module.
          ./"$app" --appimage-extract > /dev/null 2>&1
          xvfb-run -a --server-args="-screen 0 1280x900x24" \
            ./squashfs-root/AppRun > ../logs/appimage-launch.log 2>&1 &
          pid=$!
          for i in $(seq 1 10); do
            sleep 1
            if ! kill -0 "$pid" 2>/dev/null; then
              wait "$pid"; code=$?
              echo "::error::The AppImage exited after ${i}s with code $code"
              echo "--- output ---"; cat ../logs/appimage-launch.log
              exit 1
            fi
          done
          echo "Still running after 10s."
          kill "$pid" 2>/dev/null || true
          cat ../logs/appimage-launch.log

      - name: Upload launch logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-linux-logs
          path: logs/
          if-no-files-found: warn

  smoke-windows:
    needs: build
    runs-on: windows-latest
    steps:
      - name: Download the release artefacts
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p artefacts && cd artefacts
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*-setup.exe'
          ls -l

      - name: Install silently
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Get-ChildItem artefacts\*-setup.exe | Select-Object -First 1
          Write-Host "Installing $($setup.Name)"
          # /S is NSIS's silent switch. Per-user, so no elevation is needed.
          $p = Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installer exited with $($p.ExitCode)" }

      - name: Verify the installation directory and executable exist
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # The install location is not assumed: it is found, so a change to
          # productName does not silently turn this check into a no-op.
          $roots = @(
            "$env:LOCALAPPDATA\Panel Platform",
            "$env:ProgramFiles\Panel Platform",
            "${env:ProgramFiles(x86)}\Panel Platform"
          )
          $dir = $roots | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $dir) { throw "No installation directory found. Looked in:`n$($roots -join "`n")" }
          Write-Host "Installed to $dir"
          Get-ChildItem -Recurse $dir | Select-Object FullName, Length | Format-Table -AutoSize

          $exe = Get-ChildItem -Path $dir -Filter *.exe -Recurse |
                 Where-Object { $_.Name -notmatch 'uninstall' } |
                 Select-Object -First 1
          if (-not $exe) { throw "No application executable under $dir" }
          Write-Host "Executable: $($exe.FullName)"
          "APP_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "APP_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Launch it and confirm it stays running
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path logs | Out-Null
          Write-Host "Launching $env:APP_EXE"
          $p = Start-Process -FilePath $env:APP_EXE `
                 -RedirectStandardOutput logs\win-launch.out.log `
                 -RedirectStandardError  logs\win-launch.err.log `
                 -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) {
            Write-Host "::error::The application exited after less than 10s with code $($p.ExitCode)"
            Get-Content logs\win-launch.out.log -ErrorAction SilentlyContinue
            Get-Content logs\win-launch.err.log -ErrorAction SilentlyContinue
            exit 1
          }
          Write-Host "Still running after 10s."
          Stop-Process -Id $p.Id -Force
          Get-Content logs\win-launch.out.log -ErrorAction SilentlyContinue
          Get-Content logs\win-launch.err.log -ErrorAction SilentlyContinue

      - name: Uninstall
        if: always()
        shell: pwsh
        run: |
          $un = Get-ChildItem -Path $env:APP_DIR -Filter '*ninstall*.exe' -ErrorAction SilentlyContinue |
                Select-Object -First 1
          if ($un) {
            Write-Host "Uninstalling with $($un.FullName)"
            Start-Process -FilePath $un.FullName -ArgumentList '/S' -Wait
          } else {
            Write-Host "No uninstaller found; nothing to do."
          }

      - name: Upload launch logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-windows-logs
          path: logs/
          if-no-files-found: warn

  # A single place to read whether the draft is fit to publish. It does not
  # publish anything: a person still presses the button, and this only records
  # that every gate before it went green.
  release-gate:
    needs: [build, bootstrap, checksums, smoke-linux, smoke-windows]
    runs-on: ubuntu-22.04
    steps:
      - name: Report
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          echo "Builds, checksums and both smoke tests passed for $TAG."
          echo
          echo "The release is still a DRAFT. Publishing is manual and deliberate."
          echo "These tests prove the installers install and the application"
          echo "starts without immediately crashing. They do NOT prove that any"
          echo "feature works — see docs/installers.md for what still needs a VM."
