[workspace]
resolver = "2"
members = [
    "crates/api-types",
    "crates/platform",
    "crates/compatibility",
    "crates/toolchain",
    "crates/security",
    "crates/database",
    "crates/file-manager",
    "crates/project-manager",
    "crates/host-runner",
    "crates/resources",
    "crates/power",
    "crates/static-server",
    "crates/discord",
    "crates/discord-gateway",
    "crates/updater",
    "crates/app-core",
    "crates/setup",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.15"
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/paar-git/panel-platform"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
# The agent runs as a privileged service. A panic in a request handler takes
# down projects, so the paths that can panic are denied rather than discouraged.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "warn"
todo = "deny"
unimplemented = "deny"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
